name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.8.4
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      # Report-only, like the mypy baseline and coverage: a CVE in a transitive
      # pin must be visible without blocking an unrelated publish. Promote to
      # blocking once the backlog is zero.
      - name: Audit dependencies
        run: pip-audit --desc
        continue-on-error: true

  typecheck:
    name: Type check (non-blocking baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: Mypy
        # `desktop` was in none of the checked packages, so 345 lines of
        # window.py were neither executed nor type-checked.
        run: mypy analytics apis core config storage desktop
        continue-on-error: true   # lenient baseline; tighten over time

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: content_machine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        # 3.11 only: pinned deps (numpy 2.4.4 needs >=3.11; Pillow 9.5.0 — kept for
        # moviepy 1.0.3 compat — has no 3.12 wheel). 3.11 is the project's target.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # [app] brings PySide6 so the Stage 1/2 widget tests actually run here.
        # Without it three of them skip and desktop/window.py is never imported,
        # so the run window's only rendering tests sat outside CI (#670).
        run: pip install -e ".[shell,app]"
      - name: Run unit tests
        # Qt needs a platform plugin on a headless runner; offscreen is enough to
        # construct and style widgets. Measured: 23 ran, 0 skipped, 0 failures.
        env:
          QT_QPA_PLATFORM: offscreen
          CONTENT_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/content_machine_test
        run: python -m unittest discover -s tests -t . -v
      - name: Docs metric lint
        run: python -m unittest tests.test_docs_lint
