name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# #715: unfiltered push+PR runs four jobs plus postgres on every branch.
# Cancel the superseded run instead of stacking them.
# #716: github.ref alone is refs/heads/<b> on push but refs/pull/<n>/merge on
# pull_request, so a branch with an open PR still ran twice. head_ref is the
# branch name on pull_request and empty on push, so both events share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.8.4
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      # Report-only, like the mypy baseline and coverage: a CVE in a transitive
      # pin must be visible without blocking an unrelated publish. Promote to
      # blocking once the backlog is zero.
      - name: Audit dependencies
        run: pip-audit --desc
        continue-on-error: true

  typecheck:
    name: Type check (non-blocking baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: Mypy
        # `desktop` was in none of the checked packages, so 345 lines of
        # window.py were neither executed nor type-checked.
        run: mypy analytics apis core config storage desktop
        continue-on-error: true   # lenient baseline; tighten over time

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: content_machine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        # 3.11 only: pinned deps (numpy 2.4.4 needs >=3.11; Pillow 9.5.0 — kept for
        # moviepy 1.0.3 compat — has no 3.12 wheel). 3.11 is the project's target.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg
        # #415: the 2s synthetic smoke needs a real ffmpeg. ubuntu-latest does
        # not ship it, so technical-QC tests were silently skipping in CI —
        # the same class as #24/#26 shipping dead on Windows.
        # #729: PySide6 wheels also need the system GL/EGL/xkb libraries. Without
        # them the import failed, and every widget test skipped as "extra not
        # installed" while the run still reported OK.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        # [app] brings PySide6 so the widget tests actually run here (#670).
        # tests/qt_support.requires_qt refuses to skip them under CI (#729).
        run: pip install -e ".[shell,app]" coverage
      - name: Run unit tests
        # Qt needs a platform plugin on a headless runner; offscreen is enough to
        # construct and style widgets. Run under coverage for #631.
        env:
          QT_QPA_PLATFORM: offscreen
          CONTENT_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/content_machine_test
        run: coverage run -m unittest discover -s tests -t . -v
      - name: Core coverage (report-only)
        # #631: which gates in core/ no test executes. Visible, never blocking.
        run: coverage report --include="core/*" --sort=cover
        continue-on-error: true
      - name: Docs metric lint
        run: python -m unittest tests.test_docs_lint
