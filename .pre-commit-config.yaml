# Run on staged files before each commit:  pre-commit install
# Run across the whole repo on demand:      pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff           # lint, with autofix
        args: [--fix]
      - id: ruff-format    # format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: ops-command-ref
        name: ops command-ref
        language: system
        entry: python -c "from core.ops_command_ref import check_command_ref; raise SystemExit(check_command_ref())"
        pass_filenames: false
        files: ^(scripts/ops\.py|docs/ops_commands\.md)$
