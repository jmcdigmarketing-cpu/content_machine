[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-machine"
version = "0.1.0"
description = "CLI for short-form sports/gaming video: signal discovery, LLM scripting, TTS, FFmpeg render, and YouTube publishing."
readme = "README.md"
# 3.11+ because pinned numpy (2.4.4) requires Python >= 3.11.
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TapIn Media" }]

dependencies = [
    "openai==2.33.0",
    "google-api-python-client==2.196.0",
    "google-auth==2.52.0",
    "google-auth-oauthlib==1.2.2",
    "google-auth-httplib2==0.2.0",
    "requests==2.32.4",
    "beautifulsoup4==4.14.3",
    "imageio-ffmpeg==0.6.0",
    "elevenlabs==2.45.0",
    "Pillow==11.3.0",
    "numpy==2.4.4",
    "sqlalchemy==2.0.41",
    "psycopg2-binary==2.9.10",
    "alembic==1.16.1",
    "python-dotenv==1.0.1",
    "tzdata>=2024.1; platform_system == 'Windows'",
    "yt-dlp==2026.6.9",
    "goose3>=3.1.19",
]

[project.optional-dependencies]
# Developer tooling — install with: pip install -e ".[dev]"
dev = [
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pytest==8.3.4",
    "pre-commit==4.0.1",
    "types-requests",
    "types-beautifulsoup4",
    "coverage>=7.6.0",
    "pip-audit>=2.7.3",
]
# Optional sports stats providers (NFL/MLB stat lines)
sports = [
    "nfl_data_py>=0.3.0",
    "pybaseball>=2.2.7",
]
# Truly-free ($0) stack — lightweight, installs clean (no heavy ML deps, no numpy
# conflicts). This is all Free mode needs besides Ollama (a separate binary):
#   pip install -e ".[free]"
free = [
    "piper-tts>=1.2.0",     # local TTS, CPU/ONNX — no torch (TTS_PROVIDER=piper)
    "soundfile>=0.12.1",    # write local-TTS wav
    "ddgs>=6.0.0",          # keyless DuckDuckGo web search (apis/web_search_api; Free mode)
]

# Pillar 6 video-creation provider backends (heavy / GPU). Install on demand:
#   pip install -e ".[providers]"
# Each is lazy-imported behind an env gate (see docs/providers_runbook.md); absence
# just means that seam fails open to the current behavior.
providers = [
    "kokoro>=0.9.4",        # local TTS (core/tts.py TTS_PROVIDER=kokoro; torch + espeak-ng)
    "piper-tts>=1.2.0",     # local TTS, CPU/ONNX — no torch (TTS_PROVIDER=piper)
    "soundfile>=0.12.1",    # write local-TTS / music wav
    "whisperx",             # word-level caption alignment (core/caption_align.py)
    "audiocraft",           # MusicGen music beds (core/music.py)
    "ultralytics>=8.0.0",   # auto-reframe — NOTE: AGPL-3.0, see core/reframe.py
    "pypdf>=4.0.0",         # PDF text extraction (core/vault_ingest.ingest_pdf)
    "youtube-transcript-api>=0.6.0",  # YouTube transcript ingest (core/vault_ingest)
    "ddgs>=6.0.0",          # keyless DuckDuckGo web search (apis/web_search_api; Free mode)
]

# XTTS-v2 voice clone (Coqui TTS, core/tts.py TTS_PROVIDER=xtts). Kept OUT of
# [providers] because its `gruut` dep pins numpy<2.0, which conflicts with the
# project's numpy==2.4.4 — install in a SEPARATE venv if you actually need XTTS.
# Piper (in [free]) is the recommended local voice.
xtts = ["TTS>=0.22.0"]

[project.scripts]
content-machine = "main:main"

[tool.setuptools]
# This is an application, not a library: list the package dirs explicitly
# rather than auto-discovering (which would choke on data/, output/, etc.).
packages = [
    "analytics",
    "apis",
    "config",
    "core",
    "jobs",
    "publishing",
    "sports",
    "storage",
    "video",
    "youtube",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces flake8 + isort + black)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "alembic/versions", "data", "output", "assets"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (real bugs: undefined names, unused imports)
    "W",    # pycodestyle warnings
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (real bug patterns)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "S110", # try-except-pass — a swallowed exception must leave a trace
    "S112", # try-except-continue — same, inside a loop
]
# NOTE: flake8-blind-except (BLE) is still intentionally NOT enabled. It flags every
# broad `except Exception`, including the many that correctly log-and-continue for
# signal/API resilience (one failing provider must not crash discovery) — the correct
# ones outnumber the wrong ones.
#
# The real smell is a *silent* swallow, and that is now enforced: S110/S112 (2026-08-16)
# require every fail-open handler to say something. Level policy — decisions.md §24:
#   logger.warning  a guarantee is lost (persisted quota state, the run trace)
#   logger.debug    best-effort enrichment; diagnosable via CONTENT_LOG_LEVEL=DEBUG
#   # noqa: S110    silence is deliberate — write the reason on the same line
# Note `contextlib.suppress(Exception)` does NOT trip these rules; it is for a narrow,
# expected exception type, not a way to keep swallowing everything quietly.
ignore = [
    "E501",    # line length is enforced by the formatter, not as a hard error
    "B008",    # function calls in argument defaults — intentional in some CLIs
    "SIM105",  # contextlib.suppress vs try/except/pass — readability preference
    "SIM102",  # nested-if collapse — sometimes clearer left expanded
    "SIM117",  # combine with-statements — readability preference
    "RUF001",  # ambiguous unicode in strings — intentional UI glyphs (• → ✓)
    "RUF002",  # ambiguous unicode in docstrings — same
    "RUF003",  # ambiguous unicode in comments — same
    "UP017",   # datetime.UTC alias — not worth churning 66 `timezone.utc` uses
]

[tool.ruff.lint.per-file-ignores]
# Tests may use unused imports for fixtures and reach into internals.
"tests/**" = ["F401", "B011", "E402"]
# main.py loads config.settings (which reads .env) before any other project
# import, so module-level imports legitimately follow that statement.
"main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
    "analytics", "apis", "config", "core", "jobs",
    "publishing", "sports", "storage", "video", "youtube",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — static type checking (lenient baseline; tighten over time)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true       # 3rd-party libs without stubs
check_untyped_defs = true
no_implicit_optional = true
exclude = ['^(\.venv|alembic|data|output|assets)/']

# Start lenient on the noisiest modules; remove overrides as they get typed.
[[tool.mypy.overrides]]
module = ["video.*", "publishing.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest — test runner (compatible with existing unittest TestCases)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
